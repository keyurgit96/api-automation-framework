[pytest]
minversion = 6.0
pythonpath = .
testpaths = apiTest
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Register custom markers
markers =
    smoke: Smoke tests
    correctlogin: Correct login credentials tests
    incorrectlogin: Incorrect login credentials tests
    nousername: Missing username login tests
    nopassword: Missing password login tests
    correcttoken: Valid authentication token tests
    incorrecttoken: Invalid authentication token tests
    getallpost: Retrieve all posts tests
    getsinglepost: Retrieve single post tests
    nonExistantPost: Non-existent post tests
    createPost: Create post tests
    updatePost: Update post tests
    TestDeletePost: Delete post tests
    test_patch_post: Patch post tests
    testthis: General test marker
    getuser: Get user tests
    create_delete_user: Create and delete user tests
